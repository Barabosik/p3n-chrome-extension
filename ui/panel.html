<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>p3n</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="https://p3n.si" target="_blank" rel="noopener">
      <img class="light-only" src="../icons/logo.png" width="24" height="24" alt="">
      <img class="dark-only" src="../icons/logo-dark.png" width="24" height="24" alt="">
      <span class="wordmark">p<span>3</span>n</span>
    </a>
    <div class="bar-end">
      <button type="button" id="account" class="link small"></button>
      <!-- Light or dark: shows what a click does, the moon on a light panel, the sun on a dark one (theme.js). -->
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="light-only" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.25 12.1A6.5 6.5 0 0 1 7.9 3.75a6.5 6.5 0 1 0 8.35 8.35z"/></svg>
        <svg class="dark-only" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="3.25"/><path d="M10 2.5v1.5M10 16v1.5M2.5 10H4M16 10h1.5M4.7 4.7l1.05 1.05M14.25 14.25l1.05 1.05M4.7 15.3l1.05-1.05M14.25 5.75l1.05-1.05"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="input">
      <div class="row between">
        <label for="text" class="small strong">Text</label>
        <span id="count" class="small muted"></span>
      </div>
      <textarea id="text" rows="6" placeholder="Select text on any page, right-click it and choose p3n. Or paste it here."></textarea>
      <div class="row">
        <button type="button" id="check" class="btn accent">Check for AI</button>
        <button type="button" id="rewrite" class="btn ink">Rewrite</button>
        <button type="button" id="grab" class="link small push">Use selected text</button>
      </div>
      <p id="hint" class="small muted" role="status" hidden></p>
    </section>

    <section id="busy" class="busy" hidden>
      <div class="progress"><i></i></div>
      <div class="row between">
        <span id="busy-text" class="small muted"></span>
        <button type="button" id="cancel" class="link small">Cancel</button>
      </div>
    </section>

    <section id="result" aria-live="polite"></section>
  </main>

  <footer id="quota" class="small muted"></footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
